name: Build nodejs application using github actions

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  buildnodejs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Node.js version 18
        uses: actions/setup-node@v6
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run tests using npm
        run: npm test

      - name: Build the application using npm
        run: npm run build

      - name: Upload the artifact from runner to current GitHub repository
        uses: actions/upload-artifact@v7
        with:
          name: build-artifact
          path: /home/runner/work/GithubActions-NodeJs-Demo/GithubActions-NodeJs-Demo/dist/index.html
